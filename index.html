<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyHub — your calm space to learn, connect, and grow." />
    <title>StudyHub | Learn together</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-orb orb-one" aria-hidden="true"></div>
    <div class="background-orb orb-two" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#" aria-label="StudyHub home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Study<span>Hub</span></span>
      </a>
      <nav class="desktop-nav" aria-label="Primary navigation">
        <a class="active" href="#rooms">Dashboard</a>
        <a href="#activities">Activities</a>
        <a href="#rooms">Grade Rooms</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle appearance">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.7A8.5 8.5 0 0 1 9.3 3.6 8.5 8.5 0 1 0 20.4 14.7Z"></path></svg>
        </button>
        <button class="profile-chip" type="button" aria-label="Open profile">
          <span class="avatar">AM</span>
          <span class="profile-name">Alex Morgan</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </div>
    </header>

    <main class="page-shell">
      <section class="welcome-section" aria-labelledby="welcome-title">
        <div>
          <p class="eyebrow"><span class="eyebrow-dot"></span> Thursday, October 8, 2026</p>
          <h1 id="welcome-title">Welcome back, <span>Alex.</span></h1>
          <p class="welcome-copy">Ready to learn something new today?</p>
        </div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="search-input" type="search" placeholder="Search rooms, activities..." aria-label="Search rooms and activities" />
          <kbd>⌘ K</kbd>
        </div>
      </section>

      <section id="rooms" class="content-section" aria-labelledby="rooms-title">
        <div class="section-heading">
          <div><p class="section-kicker">Your learning space</p><h2 id="rooms-title">Grade rooms</h2></div>
          <a class="text-link" href="#rooms">View all <span aria-hidden="true">→</span></a>
        </div>
        <div id="room-grid" class="room-grid"></div>
      </section>

      <section id="activities" class="content-section activities-section" aria-labelledby="activities-title">
        <div class="section-heading">
          <div><p class="section-kicker">Stay on track</p><h2 id="activities-title">Upcoming activities</h2></div>
          <a class="text-link" href="#activities">View calendar <span aria-hidden="true">→</span></a>
        </div>
        <div id="activity-grid" class="activity-grid"></div>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a class="selected" href="#"><span class="nav-icon">⌂</span><span>Home</span></a>
      <a href="#rooms"><span class="nav-icon">▦</span><span>Rooms</span></a>
      <a href="#activities"><span class="nav-icon">☷</span><span>Tasks</span></a>
      <a href="#"><span class="nav-icon">♙</span><span>Profile</span></a>
    </nav>
    <script src="app.js"></script>
  </body>
</html>
